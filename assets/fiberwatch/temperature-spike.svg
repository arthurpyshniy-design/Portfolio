    <polyline points="759,205 915,189 1071,200"/>
  </g>
  <polyline points="603,388 759,205" stroke="#d6ad89" stroke-width="4" fill="none" stroke-linecap="round"/>
  <g fill="#0c1014" stroke="#8edff0" stroke-width="3">
    <circle cx="135" cy="394" r="6"/><circle cx="291" cy="383" r="6"/><circle cx="447" cy="399" r="6"/><circle cx="603" cy="388" r="6"/>
    <circle cx="915" cy="189" r="6"/><circle cx="1071" cy="200" r="6"/>
  </g>
  <circle cx="759" cy="205" r="8" fill="#d6ad89" stroke="#0c1014" stroke-width="3"/>
  <g fill="#edf0ec" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="700" text-anchor="middle">
    <text x="135" y="373">21.0</text><text x="291" y="362">21.2</text><text x="447" y="378">20.9</text><text x="603" y="367">21.1</text>
    <text x="759" y="183" fill="#d6ad89">24.5</text><text x="915" y="167">24.8</text><text x="1071" y="178">24.6</text>
  </g>
  <g fill="#89979d" font-family="ui-monospace,Consolas,monospace" font-size="13" text-anchor="middle">
    <text x="135" y="478">01</text><text x="291" y="478">02</text><text x="447" y="478">03</text><text x="603" y="478">04</text><text x="759" y="478">05</text><text x="915" y="478">06</text><text x="1071" y="478">07</text>
