<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Синтетическая температурная последовательность</title>
  <desc id="desc">Семь искусственных значений. Между четвёртым и пятым значениями происходит скачок с 21.1 до 24.5, абсолютная разница 3.4 при пороге 2.0.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#334149" stroke-width="1" opacity=".46"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d6ad89"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#0c1014"/>
  <rect width="1200" height="620" fill="url(#grid)" opacity=".34"/>
  <text x="52" y="48" fill="#8edff0" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="700" letter-spacing="2">FIBERWATCH / TEMPERATURE TRACE</text>
  <text x="52" y="82" fill="#edf0ec" font-family="system-ui,sans-serif" font-size="25" font-weight="650">Искусственная последовательность измерений</text>
  <text x="52" y="109" fill="#89979d" font-family="ui-monospace,Consolas,monospace" font-size="14">SYNTHETIC DATA · VALUES WITHOUT UNIT</text>
  <rect x="52" y="132" width="1096" height="366" fill="#10171c" stroke="#334149"/>
  <g stroke="#334149" stroke-width="1" opacity=".8">
    <line x1="104" y1="178" x2="1115" y2="178"/>
    <line x1="104" y1="232" x2="1115" y2="232"/>
    <line x1="104" y1="286" x2="1115" y2="286"/>
    <line x1="104" y1="340" x2="1115" y2="340"/>
    <line x1="104" y1="394" x2="1115" y2="394"/>
    <line x1="104" y1="448" x2="1115" y2="448"/>
  </g>
  <g fill="#89979d" font-family="ui-monospace,Consolas,monospace" font-size="13" text-anchor="end">
    <text x="91" y="183">25</text><text x="91" y="237">24</text><text x="91" y="291">23</text><text x="91" y="345">22</text><text x="91" y="399">21</text><text x="91" y="453">20</text>
  </g>
  <g stroke="#8edff0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
