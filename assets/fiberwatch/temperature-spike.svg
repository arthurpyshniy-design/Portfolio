  <path d="M678 307 L726 250" fill="none" stroke="#d6ad89" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="470" y="263" width="236" height="83" rx="2" fill="#182129" stroke="#d6ad89"/>
  <text x="489" y="291" fill="#d6ad89" font-family="ui-monospace,Consolas,monospace" font-size="15" font-weight="700">Δ соседей = 3.4</text>
  <text x="489" y="317" fill="#edf0ec" font-family="system-ui,sans-serif" font-size="15">Порог срабатывания: 2.0</text>
  <text x="52" y="545" fill="#d6ad89" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="1">TRIGGER / |Tᵢ − Tᵢ₋₁| ≥ 2.0</text>
  <text x="52" y="575" fill="#aeb9bc" font-family="system-ui,sans-serif" font-size="14">Подсвеченный переход отмечается как резкое изменение. Это не подтверждение смены режима.</text>
</svg>