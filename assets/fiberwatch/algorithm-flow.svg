<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">Схема текущей реализации учебного прототипа FiberWatch</title>
  <desc id="desc">Блок-схема показывает сравнение соседних значений, обновление счётчика аномалий, скользящего окна из трёх температур, вычисление среднего и экспериментальные условия установки и сброса флага смены режима.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#334149" stroke-width="1" opacity=".43"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8edff0"/></marker>
  </defs>
  <rect width="1200" height="880" fill="#0c1014"/>
  <rect width="1200" height="880" fill="url(#grid)" opacity=".26"/>
  <text x="48" y="46" fill="#8edff0" font-family="ui-monospace,Consolas,monospace" font-size="15" font-weight="700" letter-spacing="2">FIBERWATCH / IMPLEMENTATION MAP</text>
  <text x="48" y="79" fill="#edf0ec" font-family="system-ui,sans-serif" font-size="25" font-weight="650">Текущая логика учебного прототипа</text>
  <text x="48" y="105" fill="#89979d" font-family="ui-monospace,Consolas,monospace" font-size="13">NOT A PRODUCTION DESIGN · CURRENT CODE ONLY</text>

  <text x="48" y="143" fill="#d6ad89" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="1">A / РЕЗКОЕ ИЗМЕНЕНИЕ</text>
  <g stroke="#8edff0" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M226 205 H276"/><path d="M498 205 H552"/><path d="M710 205 H784 V177 H830"/><path d="M710 205 H784 V247 H830"/>
  </g>
  <rect x="48" y="167" width="178" height="76" rx="2" fill="#131a20" stroke="#334149"/>
  <text x="137" y="197" fill="#edf0ec" font-family="system-ui,sans-serif" font-size="17" font-weight="650" text-anchor="middle">Измерение Tᵢ</text>
  <text x="137" y="220" fill="#89979d" font-family="ui-monospace,Consolas,monospace" font-size="12" text-anchor="middle">INPUT VALUE</text>
  <rect x="276" y="167" width="222" height="76" rx="2" fill="#131a20" stroke="#334149"/>
  <text x="387" y="196" fill="#edf0ec" font-family="ui-monospace,Consolas,monospace" font-size="16" text-anchor="middle">Δ = |Tᵢ − Tᵢ₋₁|</text>
  <text x="387" y="220" fill="#aeb9bc" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Разница с предыдущим</text>
  <path d="M631 160 L710 205 L631 250 L552 205 Z" fill="#182129" stroke="#d6ad89" stroke-width="1.5"/>
  <text x="631" y="201" fill="#edf0ec" font-family="system-ui,sans-serif" font-size="15" font-weight="650" text-anchor="middle">Δ ≥ 2.0?</text>
  <text x="631" y="220" fill="#89979d" font-family="ui-monospace,Consolas,monospace" font-size="11" text-anchor="middle">THRESHOLD</text>
  <rect x="830" y="144" width="320" height="62" rx="2" fill="#172127" stroke="#8edff0"/>
  <text x="990" y="170" fill="#8edff0" font-family="ui-monospace,Consolas,monospace" font-size="15" font-weight="700" text-anchor="middle">YES / anomaly_count += 1</text>
  <text x="990" y="190" fill="#aeb9bc" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Срабатывание отмечено</text>
  <rect x="830" y="218" width="320" height="62" rx="2" fill="#182129" stroke="#334149"/>
  <text x="990" y="244" fill="#edf0ec" font-family="ui-monospace,Consolas,monospace" font-size="15" font-weight="700" text-anchor="middle">NO / anomaly_count = 0</text>
  <text x="990" y="264" fill="#aeb9bc" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Последовательность сбрасывается</text>

  <line x1="48" y1="310" x2="1152" y2="310" stroke="#334149"/>
  <text x="48" y="344" fill="#d6ad89" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="1">B / СКОЛЬЗЯЩЕЕ ОКНО</text>
  <g stroke="#8edff0" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M268 407 H319"/><path d="M493 407 H542"/><path d="M738 407 H787"/>
  </g>
  <rect x="48" y="371" width="220" height="74" rx="2" fill="#131a20" stroke="#334149"/>
  <text x="158" y="400" fill="#edf0ec" font-family="system-ui,sans-serif" font-size="16" font-weight="650" text-anchor="middle">Добавить Tᵢ</text>
  <text x="158" y="423" fill="#aeb9bc" font-family="ui-monospace,Consolas,monospace" font-size="12" text-anchor="middle">Оставить последние 3</text>
  <path d="M406 367 L493 407 L406 447 L319 407 Z" fill="#182129" stroke="#334149" stroke-width="1.5"/>
  <text x="406" y="404" fill="#edf0ec" font-family="system-ui,sans-serif" font-size="14" font-weight="650" text-anchor="middle">3 значения?</text>
  <text x="406" y="422" fill="#89979d" font-family="ui-monospace,Consolas,monospace" font-size="10" text-anchor="middle">WINDOW FULL</text>
  <rect x="542" y="371" width="196" height="74" rx="2" fill="#131a20" stroke="#334149"/>
  <text x="640" y="399" fill="#edf0ec" font-family="ui-monospace,Consolas,monospace" font-size="15" text-anchor="middle">mean = sum / 3</text>
  <text x="640" y="422" fill="#aeb9bc" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Среднее окна</text>
  <rect x="787" y="371" width="365" height="74" rx="2" fill="#131a20" stroke="#334149"/>
  <text x="969" y="400" fill="#edf0ec" font-family="ui-monospace,Consolas,monospace" font-size="15" text-anchor="middle">difference = |mean − previous|</text>
  <text x="969" y="423" fill="#aeb9bc" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Сравнение не с базовым уровнем</text>
  <path d="M406 447 V474 H495" fill="none" stroke="#89979d" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="506" y="479" fill="#89979d" font-family="system-ui,sans-serif" font-size="12">Если окно не заполнено — проверки среднего нет</text>

  <line x1="48" y1="513" x2="1152" y2="513" stroke="#334149"/>
  <text x="48" y="548" fill="#d6ad89" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="1">C / ЭКСПЕРИМЕНТАЛЬНЫЙ ФЛАГ СМЕНЫ РЕЖИМА</text>
  <rect x="48" y="572" width="337" height="124" rx="2" fill="#172127" stroke="#d6ad89"/>
  <text x="67" y="599" fill="#d6ad89" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">SET FLAG</text>
  <text x="67" y="627" fill="#edf0ec" font-family="system-ui,sans-serif" font-size="15">anomaly_count ≥ 3</text>
  <text x="67" y="651" fill="#edf0ec" font-family="system-ui,sans-serif" font-size="15">AND difference ≥ 2.0</text>
  <text x="67" y="678" fill="#aeb9bc" font-family="system-ui,sans-serif" font-size="13">Оба условия должны быть верны</text>
  <rect x="431" y="572" width="337" height="124" rx="2" fill="#131a20" stroke="#334149"/>
  <text x="450" y="599" fill="#8edff0" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">NORMAL CHECKS</text>
  <text x="450" y="627" fill="#edf0ec" font-family="system-ui,sans-serif" font-size="15">difference &lt; 2.0</text>
  <text x="450" y="651" fill="#edf0ec" font-family="system-ui,sans-serif" font-size="15">normal_check_count += 1</text>
  <text x="450" y="678" fill="#aeb9bc" font-family="system-ui,sans-serif" font-size="13">Иначе счётчик спокойствия сбрасывается</text>
  <rect x="814" y="572" width="338" height="124" rx="2" fill="#131a20" stroke="#334149"/>
  <text x="833" y="599" fill="#8edff0" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">CLEAR FLAG</text>
  <text x="833" y="627" fill="#edf0ec" font-family="system-ui,sans-serif" font-size="15">normal_check_count ≥ 3</text>
  <text x="833" y="651" fill="#edf0ec" font-family="system-ui,sans-serif" font-size="15">→ regime flag = False</text>
  <text x="833" y="678" fill="#aeb9bc" font-family="system-ui,sans-serif" font-size="13">Три спокойные проверки снимают флаг</text>

  <path d="M600 696 V735" stroke="#8edff0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="48" y="744" width="1104" height="68" rx="2" fill="#131a20" stroke="#334149"/>
  <text x="600" y="773" fill="#edf0ec" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="700" text-anchor="middle">Вывести признаки → previous = Tᵢ → следующее измерение</text>
  <text x="600" y="795" fill="#aeb9bc" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Схема отражает код прототипа; она не подтверждает качество обнаружения на реальных данных.</text>
  <text x="48" y="846" fill="#d6ad89" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">LIMITATION / Три последовательных скачка требуются для установки флага; устойчивый новый уровень может остаться неотмеченным.</text>
</svg>